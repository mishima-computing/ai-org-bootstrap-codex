name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.5"

      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cuecodec/.go-version
          cache-dependency-path: cuecodec/go.sum

      - name: Verify migration-closure CI contract
        run: python -m ai_org.migration_closure_ci

      - name: Verify zero-gap durable-body coverage
        run: python -m ai_org.registered_body_io > "$RUNNER_TEMP/durable-body-coverage-report-v1.json"

      - name: Verify frozen root codec contract
        working-directory: cuecodec
        run: go test . -run '^Test(FirstKindAdmissionProofV1|PublicContractV1|ModuleAndDependencyIntegrityManifestV1|FlatReviewV1GoldenAndStableIDLocality)$'

      - name: Verify frozen and sibling codec packages
        working-directory: cuecodec
        run: go test ./...

      - name: Build installed codec bundle
        working-directory: cuecodec
        run: |
          mkdir -p "$RUNNER_TEMP/ai-org-codec-bin"
          go build -o "$RUNNER_TEMP/ai-org-codec-bin/ai-org-cuecodec" ./cmd/ai-org-cuecodec
          echo "$RUNNER_TEMP/ai-org-codec-bin" >> "$GITHUB_PATH"

      - name: Verify installed authority-bundle handshake
        run: >-
          python -c 'import os; from ai_org.body_codec import BodyCodecClient;
          BodyCodecClient(os.path.join(os.environ["RUNNER_TEMP"],
          "ai-org-codec-bin", "ai-org-cuecodec")).handshake()'

      - name: Install test dependencies
        run: python -m pip install pytest jsonschema

      - name: Run tests
        run: python -m pytest -q
